spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/canbinesss}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:canbinesss}
    password: "${FILE_TRANSFER_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:canbinesss}}}"
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  data:
    redis:
      repositories:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

transfer:
  redis-enabled: false

logging:
  file:
    path: ./target/test-logs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
